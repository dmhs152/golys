<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golys</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #fff;
    }
    .card {
      max-width: 680px;
      padding: 48px 32px;
      text-align: center;
    }
    .tag {
      color: #93c5fd;
      letter-spacing: 0.2em;
      font-size: 14px;
    }
    h1 {
      font-size: clamp(36px, 7vw, 64px);
      margin: 12px 0 16px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #fff;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="tag">WELCOME TO MY WEBSITE</p>
    <h1>你好，我是 Golys</h1>
    <p>这里是我的个人网站，之后我会在这里放上自己的作品、学习记录和联系方式。</p>
    <a href="mailto:你的邮箱@example.com">联系我</a>
  </main>
</body>
</html>
